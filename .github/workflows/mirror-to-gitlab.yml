
name: Mirror GitHub to GitLab

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Synchronize to GitLab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/Macsigalla/dev-automation.git"

          git push gitlab --all
          git push gitlab --tags

