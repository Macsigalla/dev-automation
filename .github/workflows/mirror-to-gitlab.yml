
name: Mirror GitHub to GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Synchronize GitHub to GitLab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main branch to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.gitlab-dev-automation }}
        run: |
          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/Macsigalla/dev-automation.git"

          git push gitlab "HEAD:refs/heads/main"

